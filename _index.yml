  title: Documentação do Astra Trident 24,06
  summary: O Astra Trident é um provisionador e orquestrador de storage de código
    aberto mantido pela NetApp. Com ele, você cria volumes de storage para aplicações
    em contêiner gerenciadas pelo Docker e Kubernetes. **Leia as notas de lançamento
    para obter informações críticas sobre a atualização para o Astra Trident 24,06.**
